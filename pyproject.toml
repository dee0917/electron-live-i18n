[project]
name = "electron-live-i18n"
version = "0.1.0"
description = "Live-translate any packaged Electron app — no rebuild, no source code, no API key."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "dee0917" }]
keywords = ["electron", "asar", "i18n", "translation", "localization", "cdp", "devtools"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Internationalization",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dee0917/electron-live-i18n"
Issues = "https://github.com/dee0917/electron-live-i18n/issues"

[project.scripts]
eli = "eli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eli"]

[tool.setuptools.package-data]
eli = ["*.js"]
